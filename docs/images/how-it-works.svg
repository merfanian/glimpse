<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="How Glimpse works: hover a citation, read its bibliography entry, look it up in scholarly databases, preview the paper">
  <style>
    .card { fill: #FFFFFF; stroke: #E2E8F0; }
    .t { font: 700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0F172A; }
    .s { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
    .n { font: 800 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #4F46E5; letter-spacing: 1px; }
    .arrow { stroke: #A5B4FC; }
    .arrowhead { fill: #A5B4FC; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #111A2E; stroke: #273449; }
      .t { fill: #E2E8F0; }
      .s { fill: #A3B1C6; }
      .n { fill: #A5B4FC; }
      .arrow { stroke: #4F46E5; }
      .arrowhead { fill: #4F46E5; }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <!-- 1 hover -->
  <g transform="translate(10 25)">
    <rect class="card" x="0" y="0" width="220" height="200" rx="18" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="13" fill="url(#tile)"/>
    <path d="M35 32 v20 l5 -4.5 l3.5 7.5 l3 -1.3 l-3.5 -7.3 h6.5 z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <text class="n" x="20" y="98">STEP 1</text>
    <text class="t" x="20" y="124">Hover a citation</text>
    <text class="s" x="20" y="150">"[12]" or "(Vaswani et al.,</text>
    <text class="s" x="20" y="168">2017)" in Overleaf or any</text>
    <text class="s" x="20" y="186">pdf.js viewer.</text>
  </g>

  <!-- 2 read -->
  <g transform="translate(260 25)">
    <rect class="card" x="0" y="0" width="220" height="200" rx="18" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="13" fill="url(#tile)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36 30 h10 l7 7 v18 a2 2 0 0 1 -2 2 h-15 a2 2 0 0 1 -2 -2 v-23 a2 2 0 0 1 2 -2z"/>
      <path d="M39 42 h10 M39 47 h10 M39 52 h6"/>
    </g>
    <text class="n" x="20" y="98">STEP 2</text>
    <text class="t" x="20" y="124">Read its entry</text>
    <text class="s" x="20" y="150">Follows the PDF's own link</text>
    <text class="s" x="20" y="168">to the bibliography and parses</text>
    <text class="s" x="20" y="186">title, authors, year, DOI.</text>
  </g>

  <!-- 3 look up -->
  <g transform="translate(510 25)">
    <rect class="card" x="0" y="0" width="220" height="200" rx="18" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="13" fill="url(#tile)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round">
      <circle cx="42" cy="42" r="8"/><path d="M48 48 l6 6"/>
    </g>
    <text class="n" x="20" y="98">STEP 3</text>
    <text class="t" x="20" y="124">Look it up</text>
    <text class="s" x="20" y="150">Semantic Scholar, arXiv,</text>
    <text class="s" x="20" y="168">Crossref and OpenAlex,</text>
    <text class="s" x="20" y="186">ranked by confidence.</text>
  </g>

  <!-- 4 preview -->
  <g transform="translate(760 25)">
    <rect class="card" x="0" y="0" width="230" height="200" rx="18" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="13" fill="#FBBF24"/>
    <g fill="none" stroke="#1E1B4B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="31" y="31" width="26" height="26" rx="4"/><path d="M31 38 h26 M36 45 h12 M36 50 h8"/>
    </g>
    <text class="n" x="20" y="98">STEP 4</text>
    <text class="t" x="20" y="124">Preview it in place</text>
    <text class="s" x="20" y="150">Abstract instantly, full</text>
    <text class="s" x="20" y="168">open-access PDF in one click,</text>
    <text class="s" x="20" y="186">right beside your paper.</text>
  </g>
  <!-- arrows (drawn last so they sit on top) -->
  <g stroke-width="2.5" fill="none" stroke-linecap="round" class="arrow">
    <path d="M235 125 H248"/><path d="M485 125 H498"/><path d="M735 125 H748"/>
  </g>
  <path class="arrowhead" d="M248 119 l9 6 l-9 6z"/>
  <path class="arrowhead" d="M498 119 l9 6 l-9 6z"/>
  <path class="arrowhead" d="M748 119 l9 6 l-9 6z"/>
</svg>
